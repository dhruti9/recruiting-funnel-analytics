name: recruiting_funnel
version: "1.0.0"
config-version: 2
profile: recruiting_funnel

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Snapshot date of the ATS extract; all "as of today" metrics use this.
  as_of_date: "2026-09-30"
  raw_data_path: "../data/raw"

models:
  recruiting_funnel:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      kpis:
        +schema: kpis
      data_quality:
        +schema: data_quality

seeds:
  recruiting_funnel:
    +schema: reference

data_tests:
  recruiting_funnel:
    +store_failures: false
